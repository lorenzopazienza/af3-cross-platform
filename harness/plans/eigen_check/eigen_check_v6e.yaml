# Eigen archive check (label eigen_check; an engineering check, never a finding or a contrast): the follow-up 6
# smoke plan harness/plans/msa_smoke/msa_smoke_v6e.yaml (2PV7 _data.json, seed 1, r1, config tpu_xla) with
# only eigen_source: archive added, so AlphaFold3 is built with the Eigen of cloud/eigen_pin.sh from our bucket.
# Its 2PV7 output must be bit-identical to that smoke session's (scripts/monitor/eigen_check.sh). Generated by
# harness/plans/make_fu7_10_plans.py.

description: Eigen archive check, 2PV7 _data.json on v6e
label: eigen_check
weights: gcs
manifest: inputs/official_data/smoke_manifest.csv
eigen_source: archive

configs:
  v6e: tpu_xla

targets:
  default: [2PV7]

seeds: [1]
fresh_reps: 1
warm_rerun_seed: none
num_recycles: default
num_diffusion_samples: default
run_timeout_min: 30

deadline_min:
  v6e: 60
