# Memory limit per chip (M7; notes/analysis_plan.md section 10, row of 2026-10-14), arm G.
# Generated by make_memlimit_plans.py: 7D5C, seed 1, one fresh process per bucket size, stop rule first_failure,
# 4 h per process. Deadline from the pessimistic model in that script: median wall of a 7D5C process of G in
# the main study 714 s (10 processes), x (size/1024)^3; modelled job 585 min (3072 would exceed 240 min and stop the plan);
# deadline = ceil(job min x 1.25 + 20).

description: memory limit per chip (M7), G
label: memlimit
weights: gcs

configs:
  l4: l4_xla

targets:
  default: [7D5C]

seeds: [1]
fresh_reps: 1
warm_rerun_seed: none
buckets: [1280, 1536, 2048, 2560, 3072, 3584, 4096, 4608, 5120]
stop_rule: first_failure
num_recycles: default
num_diffusion_samples: default
run_timeout_min: 240

deadline_min:
  l4: 751
