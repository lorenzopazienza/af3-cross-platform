# Follow-up 5 (notes/analysis_plan.md section 10, row of 2026-10-18; label feat): AlphaFold3's featurisation only,
# on a host of the AMD Milan family.
# Arms on this family: V5 (v5e host n2d-48-24-v5lite-tpu, AMD EPYC 7B13, 24 vCPU, TPU runtime v2-alpha-tpuv5-lite, Ubuntu 22.04, kernel 6.5.0-1013-gcp, glibc 2.35).
# Host: n2d-standard-32, min CPU platform AMD Milan, image ubuntu-os-cloud/ubuntu-2204-lts; the TPU runtime image is not a Compute Engine image: ubuntu-2204-lts (Ubuntu 22.04, glibc 2.35; kernel 6.8, not 6.5); n2d has no 24-vCPU type: the nearest, 32 (16 is as far; the larger is taken).
# Targets: the 60 PoseBusters and 30 follow-up 1 targets (inputs/feat/manifest.csv), seeds 1 to 5, one process per
# target. CCD: the components.cif every pilot2 and main-study setup downloaded (SHA-256 f1bef735..., section 10,
# rows of 2026-10-13 and 2026-10-14), uploaded from CCD_FILE and given to build_data. No weights.
# Expected job: setup 30 min + featurisation 104 min (5 x the arms' seed-1 featurisation times on this
# family, sum of per-target medians, 90 targets) + 30 min (process start, input parsing, arrays) = 164 min;
# deadline = ceil(job min x 2.5 + 20) = 430 min; run_timeout_min 30 per target.

description: follow-up 5, featurisation only, AMD Milan host
label: feat
weights: none
featurise_only: true
save_arrays: true
manifest: inputs/feat/manifest.csv
ccd_sha256: f1bef735f3d74171fb7e79af6b46fb1a3e753f6602f5b08ec90312013e33244b

host:
  machine_type: n2d-standard-32
  min_cpu_platform: AMD Milan
  image_project: ubuntu-os-cloud
  image_family: ubuntu-2204-lts

targets:
  default: all

seeds: [1, 2, 3, 4, 5]
run_timeout_min: 30

deadline_min:
  cpu: 430
