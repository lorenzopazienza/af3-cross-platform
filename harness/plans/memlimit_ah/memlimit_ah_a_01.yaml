# Memory limit per chip (M7) on A (drafts/section10_memlimit_ah.md, the specification row (section 10 once entered); label memlimit_ah): the measurement of
# harness/plans/memlimit/ (section 10, rows of 2026-10-14) with the configuration of follow-up 3 (a100_xla on a2-ultragpu-1g).
# Generated by make_memlimit_ah_plans.py: 7D5C, seed 1, one fresh process per bucket size, stop rule first_failure,
# 4 h per process. Deadline from the pessimistic model of make_memlimit_plans.py: median wall of a 7D5C process of A
# 241 s (10 processes, r1 and r2), x (size/1024)^3; modelled job 637 min (4096 would exceed 240 min and stop the plan);
# deadline = ceil(job min x 1.25 + 20).

description: memory limit per chip (M7), A
label: memlimit_ah
weights: gcs
eigen_source: archive

configs:
  a100: a100_xla

targets:
  default: [7D5C]

seeds: [1]
fresh_reps: 1
warm_rerun_seed: none
buckets: [1280, 1536, 2048, 2560, 3072, 3584, 4096, 4608, 5120]
stop_rule: first_failure
num_recycles: default
num_diffusion_samples: default
run_timeout_min: 240

deadline_min:
  a100: 816
