  description: NVIDIA A100 80 GB (compute capability 8.0), XLA attention (A arm)
  jax_backend: gpu
  flash_attention_implementation: xla
  env:
    JAX_PLATFORMS: cuda
    XLA_FLAGS: --xla_gpu_enable_triton_gemm=false
    XLA_PYTHON_CLIENT_PREALLOCATE: true
    XLA_CLIENT_MEM_FRACTION: 0.95

# Follow-up 9 (label h100): the H100 80 GB with the settings of a100_xla (A), only the chip changes; AlphaFold3's
