  jax_backend: tpu
  flash_attention_implementation: xla

# Precision-matched arm V6h (notes/analysis_plan.md, section 11): tpu_xla plus
# JAX_DEFAULT_MATMUL_PRECISION=highest, so float32 matmuls without an explicit
# precision run as six-pass bfloat16 instead of one pass.
tpu_xla_highest:
  description: Cloud TPU, XLA attention, af3_tpu.patch, float32 matmuls at highest precision (V6h)
  jax_backend: tpu
  flash_attention_implementation: xla
  env:
    JAX_DEFAULT_MATMUL_PRECISION: highest

# Follow-up 13 (label why; notes/analysis_plan.md section 10, row of 2026-11-10, item a). Each configuration is
# tpu_xla or l4_xla with AF3_FU13_* variables added, which only harness/af3_entry.py reads (it then imports
# harness/fu13_probe.py, where they are described); the run must go through --entry, as every plan does.
# P: the perturbation of the trunk output at relative size eps (P0: eps = 0, the reference), seed 2026.
tpu_xla_fu13_p0:
  description: Cloud TPU, XLA attention, af3_tpu.patch, trunk output perturbed at relative size 0 (follow-up 13, P0)
  jax_backend: tpu
  flash_attention_implementation: xla
  env:
    AF3_FU13_PERTURB_EPS: 0
    AF3_FU13_PERTURB_SEED: 2026

tpu_xla_fu13_p14:
