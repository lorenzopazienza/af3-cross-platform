  jax_backend: tpu
  flash_attention_implementation: xla
  env:
    AF3_FU13_PERTURB_EPS: 2^-14
    AF3_FU13_PERTURB_SEED: 2026

tpu_xla_fu13_p11:
  description: Cloud TPU, XLA attention, af3_tpu.patch, trunk output perturbed at relative size 2^-11 (follow-up 13, P11)
